[profile.default]
src = "contracts"
out = "out"
libs = ["lib"]
solc_version = "0.8.24"
optimizer = true
optimizer_runs = 200
evm_version = "cancun"

# Source chain (e.g. Sepolia) and Creditcoin testnet RPCs
[rpc_endpoints]
cc3_testnet = "${CC3_TESTNET_RPC_URL}"
sepolia = "${SEPOLIA_RPC_URL}"

[fmt]
line_length = 120
